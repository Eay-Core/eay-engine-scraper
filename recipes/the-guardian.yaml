id: "the-guardian"
name: "The Guardian"
base_url: "https://www.theguardian.com"
category: "global"
country: "GLOBAL"
rate_limit_ms: 1000
requires_js: false
feeds:
  - "https://www.theguardian.com/world/rss"
  - "https://www.theguardian.com/international/rss"
  - "https://www.theguardian.com/technology/rss"
  - "https://www.theguardian.com/business/rss"
url_patterns:
  - "https://www.theguardian.com/.*"
selectors:
  title: "h1[data-gu-marker='headline'], h1"
  content: "div#maincontent, article"
  author: "address a, span[itemprop='author']"
  published_at: "time"
  summary: "meta[name='description']"
  top_image: "meta[property='og:image']"
  tags: "ul[data-component='submeta-links'] a"
  drop_elements:
    - "script"
    - "style"
    - "aside"
