[workspace]
members = [
    "crates/core",
    "crates/fetcher",
    "crates/storage-sqlite",
    "crates/daemon",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EAY Corp <dev@eay.corp>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eay-core/eay-engine-scraper"

[workspace.dependencies]
# Internal workspace crates
eay-scraper-core = { path = "crates/core" }
eay-scraper-fetcher = { path = "crates/fetcher" }
eay-scraper-storage-sqlite = { path = "crates/storage-sqlite" }
eay-scraper-daemon = { path = "crates/daemon" }

# Async runtime & utilities
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
futures = "0.3"

# Serialization & configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Web, HTTP & Parsing
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls", "cookies"] }
scraper = "0.20"
rss = "2.0"
atom_syndication = "0.12"
url = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# CLI & Server
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Observability & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
governor = "0.6"
nonzero_ext = "0.3"
